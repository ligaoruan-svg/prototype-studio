# 上传GitHub打包.command 会把它复制到 .github/workflows/package.yml
# 在 GitHub 的干净机器上同时打 Windows 和 Mac 两个安装包。
# 用法：代码推到 GitHub 后，打开仓库的 Actions →「打包安装包」→ Run workflow；
# 跑完在那次运行的页面底部下载 原型工坊-Windows / 原型工坊-Mac。
# 这里的机器上没有你的 data/，打出来的包天然是空的。
name: 打包安装包

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: 构建界面
        working-directory: frontend
        run: |
          npm ci
          node scripts/build-esm.mjs .
      - name: 安装 Inno Setup（做安装程序用）
        run: choco install innosetup -y --no-progress
      - name: 打包
        env: { PYTHONUTF8: '1' }
        run: python desktop/build_windows.py --ci
      - uses: actions/upload-artifact@v4
        with:
          name: 原型工坊-Windows
          path: release/*

  mac:
    # Apple 芯片的 Mac；这里的 Python 是官方构建，打出来的应用 macOS 11 以上都能开
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: 构建界面
        working-directory: frontend
        run: |
          npm ci
          node scripts/build-esm.mjs .
      - name: 打包
        run: bash 打包Mac应用.command
      - uses: actions/upload-artifact@v4
        with:
          name: 原型工坊-Mac
          path: release/*.dmg
