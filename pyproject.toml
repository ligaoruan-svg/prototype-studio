[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prototype-agent"
description = "原型工坊 · 本地运行的原型修改工作台"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.12,<1",
    "beautifulsoup4>=4.12,<5",
]

# 版本号只写在 backend/config.py 一处，这里动态读取，避免多处不一致。
[tool.setuptools.dynamic]
version = { attr = "backend.config.VERSION" }

# 应用按源码树运行（uvicorn backend.server:app），可编辑安装即可；
# prompts/ 和 sample/ 按项目根目录定位，不随 wheel 分发。
[tool.setuptools]
packages = ["backend"]
