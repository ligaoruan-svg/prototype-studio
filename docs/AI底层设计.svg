<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1530" width="1600" height="1530" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Noto Sans SC, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b625c"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8532f"/></marker>
    <style>
      .t1{font-size:26px;font-weight:700;fill:#2b2420}
      .sub{font-size:14px;fill:#7a6f68}
      .sec{font-size:17px;font-weight:700;fill:#2b2420}
      .secn{font-size:13px;fill:#7a6f68}
      .b{font-size:14px;font-weight:700;fill:#2b2420}
      .s{font-size:12.5px;fill:#544b45}
      .m{font-size:12px;fill:#2b2420;font-family:Menlo, Consolas, monospace}
      .tag{font-size:11px;font-weight:700;fill:#fff}
      .lbl{font-size:12px;fill:#6b625c}
      .lo{font-size:12px;fill:#b8532f;font-weight:600}
    </style>
  </defs>
  <rect width="1600" height="1530" fill="#fbf9f6"/>

  <text x="30" y="44" class="t1">原型工坊 · AI 底层设计（backend/agent.py 一次运行的全过程）</text>
  <text x="30" y="70" class="sub">一次运行 = 你发一句话后，程序和模型来回若干轮，直到汇报、提问或回答。下面按时间顺序从上往下。</text>

  <!-- ================= 1 入口 ================= -->
  <text x="30" y="106" class="sec">1 入口</text>
  <g>
    <rect x="30" y="118" width="300" height="108" rx="10" fill="#eef3fc" stroke="#3b6fd8"/>
    <text x="44" y="141" class="b">界面发起</text>
    <text x="44" y="162" class="s">发送框 · 自动 / 只讨论 / 直接改</text>
    <text x="44" y="181" class="s">点选、框选、截图、先记下的意见</text>
    <text x="44" y="200" class="s">预览现场：刚点过什么、报了什么错</text>

    <rect x="370" y="118" width="430" height="108" rx="10" fill="#fff" stroke="#c9b9ad"/>
    <text x="384" y="141" class="b">routes/agent_runs.py · 流式接口（SSE）</text>
    <text x="384" y="162" class="s">带上模型设置：单次输出、上下文预算、轮次上限</text>
    <text x="384" y="181" class="s">你点「停止」→ 在两轮之间停下，已改好的照常检查</text>
    <text x="384" y="200" class="s">事件实时回界面：思考旁白、每一步、计划、结论</text>

    <rect x="840" y="118" width="380" height="108" rx="10" fill="#fdf2ea" stroke="#b8532f" stroke-width="1.4"/>
    <text x="854" y="141" class="b">run_agent()</text>
    <text x="854" y="162" class="s">不管成败，都记一份运行记录 → runs/*.json</text>
    <text x="854" y="181" class="s">每轮：tokens、命中缓存、调了哪些工具、错在哪</text>
    <text x="854" y="203" class="lo">↺ 自动修报错 / 自检问题 / 勾选建议 都从这里再进来</text>

    <rect x="1260" y="118" width="310" height="108" rx="10" fill="#fff" stroke="#c9b9ad"/>
    <text x="1274" y="141" class="b">推给界面的事件</text>
    <text x="1274" y="162" class="m">intent · model_wait · note_delta</text>
    <text x="1274" y="181" class="m">step_start / done / error · plan</text>
    <text x="1274" y="200" class="m">text_delta · candidate_ready</text>
  </g>
  <g stroke="#6b625c" stroke-width="1.6" marker-end="url(#a)">
    <line x1="331" y1="172" x2="368" y2="172"/><line x1="801" y1="172" x2="838" y2="172"/><line x1="1221" y1="172" x2="1258" y2="172"/>
  </g>

  <!-- ================= 2 准备 ================= -->
  <text x="30" y="266" class="sec">2 准备（只做一次）</text>
  <text x="196" y="266" class="secn">拼好的内容之后每一轮都原样重发：开头不变，模型服务的缓存才命中得了</text>

  <rect x="30" y="280" width="360" height="148" rx="10" fill="#fff" stroke="#c9b9ad"/>
  <text x="44" y="303" class="b">① 判断意图 resolve_intent</text>
  <text x="44" y="325" class="s">按钮选了就听按钮</text>
  <text x="44" y="344" class="s">自动：问句、「别改」→ 讨论；「改 / 加 / 删」→ 修改</text>
  <text x="44" y="363" class="s">讨论模式：拿掉修改、汇报、计划、外壳这几个工具，</text>
  <text x="44" y="382" class="s">系统提示换成 discussion-system.md</text>
  <text x="44" y="401" class="s">风格没有页面外壳 → 不给 start_from_shell</text>

  <rect x="30" y="442" width="360" height="130" rx="10" fill="#fff" stroke="#c9b9ad"/>
  <text x="44" y="465" class="b">② 定位目标</text>
  <text x="44" y="487" class="s">保存的修改意见 + 这次点选（多选最多 16 个）</text>
  <text x="44" y="506" class="s">带上在哪个弹窗、子页面、哪一页路由</text>
  <text x="44" y="525" class="s">locate_lines：拿元素的文字、id、data-pid、class</text>
  <text x="44" y="544" class="s">去源码里对，算出「大概在第几行」</text>

  <rect x="410" y="280" width="820" height="292" rx="10" fill="#fdf2ea" stroke="#b8532f" stroke-width="1.4"/>
  <text x="424" y="303" class="b">③ 发给模型的 messages</text>
  <rect x="424" y="314" width="792" height="78" rx="8" fill="#fff" stroke="#e7c3ad"/>
  <rect x="424" y="314" width="64" height="20" rx="6" fill="#b8532f"/><text x="456" y="328" class="tag" text-anchor="middle">system</text>
  <text x="500" y="329" class="s">agent-system.md 工作方式（约 6 千字）+ design-spec.md 设计规范（选了风格时，视觉部分以风格为准）</text>
  <text x="500" y="349" class="s">+ 这个项目的风格 / skill 正文和要点（≤ 8000 字）+ 组件库清单 + 记忆里的长期约定</text>
  <text x="500" y="369" class="s">整次运行固定不变 → 每轮都命中缓存</text>
  <rect x="424" y="400" width="792" height="40" rx="8" fill="#fff" stroke="#e7c3ad"/>
  <rect x="424" y="400" width="64" height="20" rx="6" fill="#8a847f"/><text x="456" y="414" class="tag" text-anchor="middle">history</text>
  <text x="500" y="416" class="s">这一页最近 10 条对话（每条 ≤ 3000 字），带上还没执行的建议、待确认的选项</text>
  <rect x="424" y="448" width="792" height="114" rx="8" fill="#fff" stroke="#e7c3ad"/>
  <rect x="424" y="448" width="64" height="20" rx="6" fill="#3b6fd8"/><text x="456" y="462" class="tag" text-anchor="middle">user</text>
  <text x="500" y="463" class="s">背景资料：项目、页面、版本 · 修改意见 · 定位目标和行号 · 页面骨架</text>
  <text x="500" y="482" class="s">代码地图（≤ 4000 字，函数、页面、数据、绑定在第几行）· 预取片段（≤ 6000 字，按你这轮的话先找好）</text>
  <text x="500" y="501" class="s">预览现场 · 上次检查的报错 · 空外壳说明和外壳里现成的组件</text>
  <text x="500" y="522" class="s" font-weight="700">———— 用户这轮说的是：你的原话（+ 截图、框选区域）</text>
  <text x="500" y="542" class="s">+ 界面不是中文时的语言提示；像长期约定时提醒它 remember</text>

  <rect x="1250" y="280" width="320" height="130" rx="10" fill="#fff" stroke="#c9b9ad"/>
  <text x="1264" y="303" class="b">④ 基线</text>
  <text x="1264" y="325" class="s">先检查一遍原页面，原来就有的</text>
  <text x="1264" y="344" class="s">问题记下来（坏脚本、重复 data-pid）</text>
  <text x="1264" y="363" class="s">之后只拦这次新冒出来的问题，</text>
  <text x="1264" y="382" class="s">不让老毛病挡住所有修改</text>

  <rect x="1250" y="424" width="320" height="148" rx="10" fill="#fff" stroke="#c9b9ad"/>
  <text x="1264" y="447" class="b">⑤ 是在修上一版的报错吗</text>
  <text x="1264" y="469" class="s">运行检查没过时会自动再跑一次：</text>
  <text x="1264" y="488" class="s">从那个没保存的候选版本接着改，</text>
  <text x="1264" y="507" class="s">只修报错，不从头再做</text>
  <text x="1264" y="526" class="s">提交时仍和已保存的页面比</text>

  <!-- ================= 3 主循环 ================= -->
  <text x="30" y="612" class="sec">3 主循环（每一轮做这些，最多「轮次上限」轮，默认 24）</text>
  <rect x="30" y="624" width="1540" height="500" rx="14" fill="#fff" stroke="#b8532f" stroke-width="1.6"/>

  <!-- 左：一轮的五步 -->
  <g>
    <rect x="60" y="642" width="470" height="104" rx="10" fill="#fdf6f1" stroke="#efd6c6"/>
    <text x="74" y="664" class="b">a 发之前先瘦身</text>
    <text x="74" y="685" class="s">读规范、组件、skill 的结果：用过 2 轮就收成一句话</text>
    <text x="74" y="703" class="s">读源码的结果：页面改过且过了 2 轮，或 8 轮后收起</text>
    <text x="74" y="721" class="s">大段修改参数（自己写的代码）：应用 2 轮后收起</text>
    <text x="74" y="739" class="s">总长还超「上下文预算」→ 再收较早的工具结果</text>

    <rect x="60" y="760" width="470" height="70" rx="10" fill="#eef7f1" stroke="#b9dcc7"/>
    <text x="74" y="782" class="b">b 调模型 chat()（deepseek_client.py）</text>
    <text x="74" y="802" class="s">流式输出；服务忙、断网自动重试 3 次</text>
    <text x="74" y="820" class="s">旁白实时推给界面；记下 tokens 和命中缓存的部分</text>

    <rect x="60" y="844" width="470" height="88" rx="10" fill="#fdf6f1" stroke="#efd6c6"/>
    <text x="74" y="866" class="b">c 看它回了什么</text>
    <text x="74" y="887" class="s">被截断（超过「单次输出」，思考也算）→ 整轮丢弃，</text>
    <text x="74" y="905" class="s">让它拆小再来；连续 3 次就停</text>
    <text x="74" y="923" class="s">没调工具：讨论模式当成回答；修改模式催它，最多两次</text>

    <rect x="60" y="946" width="470" height="70" rx="10" fill="#fdf6f1" stroke="#efd6c6"/>
    <text x="74" y="968" class="b">d 逐个执行它要的工具（右边）</text>
    <text x="74" y="988" class="s">同一段第二次读 → 回「读过了」；把动作名当工具调 →</text>
    <text x="74" y="1006" class="s">自动包成 apply_operations；本轮没给的工具 → 拒绝</text>

    <rect x="60" y="1030" width="470" height="78" rx="10" fill="#fdf6f1" stroke="#efd6c6"/>
    <text x="74" y="1052" class="b">e 一轮结束</text>
    <text x="74" y="1072" class="s">汇报 / 提问 / 回答了 → 跳出循环</text>
    <text x="74" y="1091" class="s">页面改过 → 计划自动往下推一步；过守卫（右下）</text>
    <text x="400" y="1052" class="lo">↺ 回到 a，下一轮</text>
  </g>
  <g stroke="#6b625c" stroke-width="1.5" marker-end="url(#a)">
    <line x1="295" y1="747" x2="295" y2="758"/><line x1="295" y1="831" x2="295" y2="842"/>
    <line x1="295" y1="933" x2="295" y2="944"/><line x1="295" y1="1017" x2="295" y2="1028"/>
  </g>
  <path d="M60 1070 C40 1070 40 694 58 694" fill="none" stroke="#b8532f" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ao)"/>

  <!-- 右上：工具 -->
  <rect x="560" y="642" width="990" height="236" rx="10" fill="#fafaf8" stroke="#d8d1ca"/>
  <text x="574" y="664" class="b">工具（agent_tools.py，共 18 个）</text>
  <g>
    <rect x="574" y="676" width="236" height="192" rx="8" fill="#fff" stroke="#d8d1ca"/>
    <text x="586" y="697" class="b" fill="#2f5bb5">读源码</text>
    <text x="586" y="718" class="m">inspect_page</text><text x="586" y="734" class="s">页面概况 + 目标的原文、行号</text>
    <text x="586" y="754" class="m">search_source</text><text x="586" y="770" class="s">命中行全给，邻居行只给开头</text>
    <text x="586" y="790" class="m">read_source_slice</text><text x="586" y="806" class="s">按行读，一次 ≤ 预算的 1/4</text>
    <text x="586" y="826" class="m">read_region</text><text x="586" y="842" class="s">读标记过的区块</text>
    <text x="586" y="860" class="s">空外壳：不给整份读，直接给组件</text>

    <rect x="820" y="676" width="236" height="192" rx="8" fill="#fff" stroke="#d8d1ca"/>
    <text x="832" y="697" class="b" fill="#55439a">查资料</text>
    <text x="832" y="718" class="m">read_skill / read_skill_file</text><text x="832" y="734" class="s">风格规范，按行读一节</text>
    <text x="832" y="754" class="m">search_skill_file</text><text x="832" y="770" class="s">在组件库里搜组件名</text>
    <text x="832" y="790" class="m">read_component</text><text x="832" y="806" class="s">看懂组件结构（插入不用读）</text>
    <text x="832" y="826" class="m">search_chats</text><text x="832" y="842" class="s">翻以前的对话</text>
    <text x="832" y="860" class="m">remember / forget</text>

    <rect x="1066" y="676" width="236" height="192" rx="8" fill="#fff" stroke="#e7c3ad"/>
    <text x="1078" y="697" class="b" fill="#9c4325">改</text>
    <text x="1078" y="718" class="m">apply_operations</text><text x="1078" y="734" class="s">一次放多个操作：替换原文、</text>
    <text x="1078" y="750" class="s">改文字、插入、插组件、shell_add</text>
    <text x="1078" y="772" class="m">start_from_shell</text><text x="1078" y="788" class="s">把风格外壳整份放进页面</text>
    <text x="1078" y="810" class="m">update_plan</text><text x="1078" y="826" class="s">列 2–6 步计划，只列一次，</text>
    <text x="1078" y="842" class="s">之后程序按修改自动推进</text>

    <rect x="1312" y="676" width="226" height="192" rx="8" fill="#fff" stroke="#d8d1ca"/>
    <text x="1324" y="697" class="b" fill="#246e48">收尾</text>
    <text x="1324" y="718" class="m">report_result</text><text x="1324" y="734" class="s">汇报 + 每条意见做没做完</text>
    <text x="1324" y="754" class="m">ask_user</text><text x="1324" y="770" class="s">一个问题，2–3 个选项</text>
    <text x="1324" y="790" class="m">answer_user</text><text x="1324" y="806" class="s">讨论模式：回答 + 建议</text>
    <text x="1324" y="826" class="m">verify_page</text><text x="1324" y="842" class="s">按选择器断言检查</text>
  </g>

  <!-- 右中：apply 内部 -->
  <rect x="560" y="892" width="990" height="112" rx="10" fill="#fdf6f1" stroke="#e7c3ad"/>
  <text x="574" y="914" class="b">apply_operations 内部（patcher.py）</text>
  <g>
    <rect x="574" y="926" width="150" height="66" rx="7" fill="#fff" stroke="#e7c3ad"/>
    <text x="584" y="946" class="s">组件只写名字</text><text x="584" y="964" class="s">→ 程序换成原文</text><text x="584" y="982" class="s">（省输出、防截断）</text>
    <rect x="740" y="926" width="170" height="66" rx="7" fill="#fff" stroke="#e7c3ad"/>
    <text x="750" y="946" class="s">先在页面上改；</text><text x="750" y="964" class="s">有暂存版就再在</text><text x="750" y="982" class="s">暂存版上试一次</text>
    <rect x="926" y="926" width="190" height="66" rx="7" fill="#fff" stroke="#e7c3ad"/>
    <text x="936" y="946" class="s">检查：结构、data-pid、</text><text x="936" y="964" class="s">JS 语法（node）、全局</text><text x="936" y="982" class="s">点击监听、页面跳转</text>
    <rect x="1132" y="926" width="130" height="66" rx="7" fill="#fff" stroke="#e7c3ad"/>
    <text x="1142" y="946" class="s">和基线比</text><text x="1142" y="964" class="s">只看新冒出来</text><text x="1142" y="982" class="s">的问题</text>
    <rect x="1278" y="926" width="258" height="31" rx="7" fill="#eef7f1" stroke="#b9dcc7"/>
    <text x="1288" y="946" class="s">通过 → 页面更新，返回「改到哪几行」</text>
    <rect x="1278" y="961" width="258" height="31" rx="7" fill="#fbecec" stroke="#e6bdbd"/>
    <text x="1288" y="981" class="s">只有语法错 → 整体暂存，报行列和原文</text>
  </g>
  <g stroke="#6b625c" stroke-width="1.4" marker-end="url(#a)">
    <line x1="725" y1="959" x2="738" y2="959"/><line x1="911" y1="959" x2="924" y2="959"/>
    <line x1="1117" y1="959" x2="1130" y2="959"/><line x1="1263" y1="959" x2="1276" y2="959"/>
  </g>

  <!-- 右下：守卫 -->
  <rect x="560" y="1018" width="990" height="90" rx="10" fill="#fbf6e9" stroke="#e2cf9c"/>
  <text x="574" y="1040" class="b">守卫：防止空转、把轮次烧光</text>
  <text x="574" y="1062" class="s">连续 4 轮只读不改 → 催它：改，或说明不用改，或问你</text>
  <text x="574" y="1082" class="s">连续 6 轮还在读 → 收尾：只剩提问、汇报、改</text>
  <text x="574" y="1100" class="s">剩 3 轮 → 提醒合并写完；已改好且剩 2 轮 → 只许汇报</text>
  <text x="1070" y="1062" class="s">同一工具同一理由被拒 3 次 → 停</text>
  <text x="1070" y="1082" class="s">补丁失败 5 次 / 参数坏 3 次 → 停</text>
  <text x="1070" y="1100" class="s">中途停下：已改好、过了检查的部分照样交出去</text>

  <!-- ================= 4 结束之后 ================= -->
  <text x="30" y="1162" class="sec">4 结束之后</text>
  <rect x="30" y="1176" width="360" height="92" rx="10" fill="#fff" stroke="#c9b9ad"/>
  <text x="44" y="1199" class="b">讨论 → 回答 + 最多 3 条建议</text>
  <text x="44" y="1220" class="s">建议可以勾选，点「修改」= 新的一次运行：</text>
  <text x="44" y="1239" class="s">「按已讨论的建议修改」，直接改模式</text>
  <rect x="30" y="1280" width="360" height="74" rx="10" fill="#fff" stroke="#c9b9ad"/>
  <text x="44" y="1303" class="b">提问 → 选项卡片</text>
  <text x="44" y="1324" class="s">你点一个选项 = 带着原需求再跑一次</text>

  <g>
    <rect x="410" y="1176" width="270" height="108" rx="10" fill="#fdf2ea" stroke="#b8532f"/>
    <text x="424" y="1199" class="b">有改动 → 候选版本</text>
    <text x="424" y="1220" class="s">transactions.stage() 存进 changes/</text>
    <text x="424" y="1239" class="s">附改动落点、超出点选范围的提示、</text>
    <text x="424" y="1258" class="s">这次用了多少 tokens</text>

    <rect x="710" y="1176" width="270" height="108" rx="10" fill="#eef3fc" stroke="#3b6fd8"/>
