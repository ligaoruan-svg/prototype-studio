<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>用户管理</title><style>
body{margin:0;background:#f5f7fa;font-family:Arial,"PingFang SC",sans-serif;color:#111827}.app{display:grid;grid-template-columns:190px 1fr;min-height:100vh}.side{background:#111827;color:#fff;padding:20px}.side h2{font-size:18px}.side a{display:block;color:#cbd5e1;padding:10px;border-radius:7px;text-decoration:none;margin:4px 0}.side a.active{background:#273244;color:#fff}.main{padding:28px}.head{display:flex;justify-content:space-between;align-items:center}.card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;margin-top:18px;padding:16px}.filters{display:flex;gap:10px}.filters input,.filters select{padding:9px;border:1px solid #d1d5db;border-radius:7px}.btn{padding:9px 14px;border-radius:7px;border:1px solid #d1d5db;background:#fff}.btn.primary{background:#111827;color:#fff;border-color:#111827}table{width:100%;border-collapse:collapse;margin-top:14px}th,td{padding:12px;border-bottom:1px solid #e5e7eb;text-align:left}.modal{display:none;position:fixed;inset:0;background:#0007;place-items:center}.modal.open{display:grid}.dialog{background:#fff;width:420px;border-radius:12px;padding:20px}.dialog input{width:100%;padding:9px;margin:7px 0;border:1px solid #d1d5db;border-radius:7px}
</style></head><body><div class="app"><aside class="side"><h2>企业运营平台</h2><a class="active" href="#users">用户管理</a><a href="#roles">角色管理</a></aside><main class="main"><div class="head"><div><h1>用户管理</h1><p>维护系统用户和状态信息</p></div><button id="addBtn" class="btn primary">新增用户</button></div><section class="card"><div class="filters"><input id="kw" placeholder="搜索姓名 / 邮箱"><select id="status"><option>全部状态</option><option>启用</option><option>停用</option></select><button class="btn" id="searchBtn">查询</button></div><table><thead><tr><th>姓名</th><th>邮箱</th><th>部门</th><th>状态</th></tr></thead><tbody id="rows"><tr><td>张晨</td><td>zhang@example.com</td><td>产品部</td><td>启用</td></tr><tr><td>李欣</td><td>li@example.com</td><td>研发部</td><td>启用</td></tr></tbody></table></section></main></div><div class="modal" id="modal"><div class="dialog"><h3>新增用户</h3><input id="name" placeholder="姓名"><input id="email" placeholder="邮箱"><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px"><button class="btn" id="cancel">取消</button><button class="btn primary" id="save">保存</button></div></div></div><script>
const m=document.querySelector('#modal'); document.querySelector('#addBtn').onclick=()=>m.classList.add('open'); document.querySelector('#cancel').onclick=()=>m.classList.remove('open'); document.querySelector('#save').onclick=()=>{const n=document.querySelector('#name').value.trim();const e=document.querySelector('#email').value.trim();if(!n||!e.includes('@')){alert('请填写姓名和正确邮箱');return}document.querySelector('#rows').insertAdjacentHTML('beforeend',`<tr><td>${n}</td><td>${e}</td><td>未分配</td><td>启用</td></tr>`);m.classList.remove('open')};document.querySelector('#searchBtn').onclick=()=>{const q=document.querySelector('#kw').value.toLowerCase();document.querySelectorAll('#rows tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')};
</script></body></html>
