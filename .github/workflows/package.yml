# scripts/上传GitHub打包.command 会把它复制到 .github/workflows/package.yml
# 在 GitHub 的干净机器上同时打 Windows 和 Mac 两个安装包。
# 用法：代码推到 GitHub 后，打开仓库的 Actions →「打包安装包」→ Run workflow；
# 跑完在那次运行的页面底部下载 原型工坊-Windows / 原型工坊-Mac。
# 这里的机器上没有你的 data/，打出来的包天然是空的。
name: 打包安装包

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: 构建界面
        working-directory: frontend
        run: |
          npm ci
          node scripts/build-esm.mjs .
      - name: 安装 Inno Setup（做安装程序用）
        run: choco install innosetup -y --no-progress
      - name: 打包
        env: { PYTHONUTF8: '1' }
        run: python desktop/build_windows.py --ci
      - uses: actions/upload-artifact@v4
        with:
          name: 原型工坊-Windows
          path: release/*

  mac:
    # Apple 芯片的 Mac；这里的 Python 是官方构建，打出来的应用 macOS 11 以上都能开
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: 构建界面
        working-directory: frontend
        run: |
          npm ci
          node scripts/build-esm.mjs .
      - name: 打包
        run: bash scripts/打包Mac应用.command
      - uses: actions/upload-artifact@v4
        with:
          name: 原型工坊-Mac
          path: release/*.dmg

  # 推 v* 标签时：两个平台都打完，自动发一个 Release，安装包挂在上面给别人下载
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: docs }
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: 发布
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          TAG="$GITHUB_REF_NAME"; V="${TAG#v}"
          # GitHub 会把附件名里的中文去掉（变成「-6.0.dmg」），上传前换成英文名
          mkdir up
          for f in dist/*; do
            case "$f" in
              *.dmg) cp "$f" "up/PrototypeStudio-$V-macOS.dmg" ;;
              *.exe) cp "$f" "up/PrototypeStudio-$V-Windows-Setup.exe" ;;
              *.zip) cp "$f" "up/PrototypeStudio-$V-Windows-Portable.zip" ;;
            esac
          done
          NOTES="下载：macOS 用 PrototypeStudio-$V-macOS.dmg（Apple 芯片，macOS 11 以上）；Windows 用 PrototypeStudio-$V-Windows-Setup.exe 安装，或免安装的 PrototypeStudio-$V-Windows-Portable.zip。第一次打开的说明见 README。"
          # 这一版改了什么：docs/版本说明/<版本>.md 有就附在后面
          if [ -f "docs/版本说明/$V.md" ]; then NOTES="$NOTES"$'\n\n'"$(cat "docs/版本说明/$V.md")"; fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # 同一个版本重新打包：换掉旧附件
            # 按附件 id 删：旧附件名是「-6.0.dmg」这种以 - 开头的，当参数传会被当成选项
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" -q '.assets[].id' | while read -r id; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id"
            done
            gh release upload "$TAG" up/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes "$NOTES"
          else
            gh release create "$TAG" up/* --repo "$GITHUB_REPOSITORY" --title "原型工坊 $V" --notes "$NOTES"
          fi
